<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Beverly Xu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body {
      background: var(--off-white);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      /* override global left padding so scene is truly centered */
      padding-left: 0;
      padding-right: 0;
      width: 100%;
    }

    .err-scene {
      text-align: center;
      position: relative;
      padding: var(--space-xl);
    }

    /* Animated SVG illustration */
    .err-illustration {
      width: 320px;
      height: 220px;
      margin: 0 auto var(--space-xl);
      position: relative;
    }

    /* Floating elements in illustration */
    .ill-robot {
      animation: robotBob 2.5s ease-in-out infinite;
    }
    @keyframes robotBob {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    .ill-question {
      animation: qSpin 4s ease-in-out infinite;
    }
    @keyframes qSpin {
      0%,100% { transform: rotate(-8deg) translateY(0); }
      50%      { transform: rotate(8deg) translateY(-6px); }
    }

    .ill-leaf1 { animation: leafFloat1 3s ease-in-out infinite; }
    .ill-leaf2 { animation: leafFloat2 3.5s ease-in-out infinite; }
    @keyframes leafFloat1 {
      0%,100% { transform: translateY(0) rotate(10deg); }
      50%      { transform: translateY(-15px) rotate(-5deg); }
    }
    @keyframes leafFloat2 {
      0%,100% { transform: translateY(0) rotate(-15deg); }
      50%      { transform: translateY(-10px) rotate(10deg); }
    }

    .err-code {
      font-family: var(--font-ui);
      font-size: clamp(5rem, 18vw, 12rem);
      line-height: 0.9;
      color: var(--lavender);
      -webkit-text-stroke: 3px var(--ink);
      animation: wiggle 4s ease-in-out infinite;
      margin-bottom: var(--space-md);
    }
    @keyframes wiggle {
      0%,100% { transform: rotate(-1.5deg) skewX(-1deg); }
      50%      { transform: rotate(1.5deg) skewX(1deg); }
    }

    .err-message {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-style: italic;
      margin-bottom: var(--space-sm);
    }

    .err-sub {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--ink-soft);
      margin-bottom: var(--space-xl);
      max-width: 380px;
      line-height: 1.6;
    }

    .btn-home {
      display: inline-block;
      padding: var(--space-sm) var(--space-xl);
      border: var(--border-thick);
      background: var(--sage);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--ink);
      text-decoration: none;
      box-shadow: var(--shadow-md);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: transform 0.15s var(--ease-spring), box-shadow 0.15s, background 0.15s;
    }
    .btn-home:hover {
      transform: translate(-3px, -3px);
      box-shadow: var(--shadow-lg);
      background: var(--lavender);
    }

    /* Scattered background shapes */
    .bg-shape {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      font-size: 3rem;
      opacity: 0.07;
    }
    .bg-shape:nth-child(1) { top: 10%; left: 8%;  animation: leafFloat1 5s infinite; }
    .bg-shape:nth-child(2) { top: 70%; left: 5%;  animation: leafFloat2 6s infinite; }
    .bg-shape:nth-child(3) { top: 20%; right: 8%; animation: leafFloat1 4s infinite; }
    .bg-shape:nth-child(4) { top: 80%; right: 6%; animation: leafFloat2 7s infinite; }
    .bg-shape:nth-child(5) { top: 45%; left: 50%; animation: leafFloat1 5.5s infinite; }

    .err-scene { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <!-- CURSOR -->
  <div class="cursor cursor-ring"></div>
  <div class="cursor cursor-dot"></div>

  <!-- Background decoration -->
  <div class="bg-shape">🍃</div>
  <div class="bg-shape">⚡</div>
  <div class="bg-shape">🌿</div>
  <div class="bg-shape">🔌</div>
  <div class="bg-shape">⚙️</div>

  <div class="err-scene">
    <h1 class="err-code">404</h1>
    <p class="err-message">Page not found!</p>
    <p class="err-sub">
      Looks like this page got lost in the leaf pile. Or maybe a robot misrouted the packet. 
      Either way, there's nothing here — even the WiFi is confused.
    </p>
    <a href="../index.html" class="btn-home">↩ take me home</a>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
